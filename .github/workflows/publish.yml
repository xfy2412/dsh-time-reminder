# Release: push a `v*` tag (or run this workflow by hand) and the package goes to
# the npm registry.
#
# Requires one repository secret: NPM_TOKEN — an npm automation token with
# publish rights for `dsh-time-reminder`.
#
# `pnpm publish` runs the `prepack` script, so the tarball is built from `src/`
# in this checkout; `lib/` is never taken from git.
name: publish

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Never publish something the gates have not accepted.
      - run: pnpm run check
      # A tag-triggered run must name the version it publishes, so a stray tag
      # cannot ship a package under someone else's version number.
      - if: startsWith(github.ref, 'refs/tags/')
        run: |
          version="v$(node -p 'require("./package.json").version')"
          if [ "$version" != "${GITHUB_REF_NAME}" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match package version ${version}" >&2
            exit 1
          fi
      # `--no-git-checks` keeps the publish independent of branch and tag state;
      # the tag that triggered this run is the version authority. The package is
      # unscoped, so it defaults to public access.
      - run: pnpm publish --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
