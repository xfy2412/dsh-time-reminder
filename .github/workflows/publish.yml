# Release: push a `v*` tag (or run this workflow by hand) and the package goes to
# the npm registry through **trusted publishing (OIDC)** — no long-lived token.
#
# One-time setup, run once from a machine logged into npm as the package owner:
#
#   npm trust github dsh-time-reminder \
#     --repo xfy2412/dsh-time-reminder --file publish.yml --allow-publish
#
# After that this workflow authenticates by exchanging the GitHub OIDC token
# (`id-token: write`) for a short-lived npm credential, and npm attaches a
# provenance attestation automatically.
#
# `npm publish` (not `pnpm publish`) runs the publish step: npm 11.5.1+ performs
# the trusted-publishing exchange, while pnpm's publish command documents only
# `--provenance` and no OIDC flow. Everything else here stays on pnpm.
#
# If trusted publishing is not configured, fall back to a token by uncommenting
# the `env:` block on the publish step and adding an NPM_TOKEN secret.
name: publish

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  # Required for the OIDC exchange; without it npm cannot authenticate.
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          # Registry only: with trusted publishing there is no NODE_AUTH_TOKEN to
          # wire up.
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Never publish something the gates have not accepted.
      - run: pnpm run check
      # A tag-triggered run must name the version it publishes, so a stray tag
      # cannot ship a package under someone else's version number.
      - if: startsWith(github.ref, 'refs/tags/')
        run: |
          version="v$(node -p 'require("./package.json").version')"
          if [ "$version" != "${GITHUB_REF_NAME}" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match package version ${version}" >&2
            exit 1
          fi
      # `prepack` builds lib/ here, so the tarball always matches src/.
      - run: npm publish
        # env:
        #   NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
